<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tsncd</title>
  <!-- Flex: https://tympanus.net/codrops/css_reference/flexbox/ -->
   <!-- Anchors: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_anchor_positioning/Using -->
  <!-- KaTeX's stylesheet is bundled from `node_modules` by the entry point, not
       linked from a CDN: image capture needs it same-origin. See the note in
       `src/display/HTMLRender/HTMLAnnotationHandler.ts`. -->
  <style>
    /* The page is painted in the canvas colour of the dark theme before the
       bundle runs, which is `darkDiagramTheme` in `src/display/Render/DiagramTheme.ts`,
       and `src/display/loadingScreen.ts` repaints it in the theme of the
       message once the message is known. */
    html {
      color-scheme: dark;
    }
    body {
      font-family: sans-serif;
      margin: 0 auto;
      padding: 20px;
      background-color: #1e1e1e;
      color: #dedede;
    }
    .page-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .page-loading-ring {
      width: 36px;
      height: 36px;
      border: 3px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      opacity: 0.7;
      animation: page-loading-turn 0.9s linear infinite;
    }
    @keyframes page-loading-turn {
      to {
        transform: rotate(360deg);
      }
    }
    button {
      margin-right: 10px;
      padding: 5px 10px;
    }
    .diagram-container {
      display: flex;
      flex-direction: row;
      min-width: 50px;
      width: fit-content;
      height: fit-content;
    }
    .horizontal-box {
      display: flex;
      flex-direction: row;
      justify-content: start;
      align-items: center;
      height: fit-content;
      width: fit-content;
    }
    .vertical-box {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      height: fit-content;
      width: fit-content;
    }
    .anchor {
      height: 20px;
      width: 0px;
    }
    .fill {
      height: 100%;
      width: 100%;
      /* display: flex;
      flex-direction: row;
      justify-content: start;
      align-items: center; */
      /* height: fit-content;
      width: fit-content; */
    }
    .times {
      display: flex;
      flex-direction: column;
      /* align-items: stretch; */
      width: 100%;
      flex-grow: 1; /* Don't grow unless forced */
      flex-shrink: 1; /* Can shrink */
      flex-basis: auto; /* Fit content */
      justify-content: space-evenly;
      /* min-width: 50px;
      max-width: 100px; */
      /* width: fit-content; */
      /* max-width: 100px; */
      flex: 1;
    }
    .compose {
      display: flex;
      flex-direction: row;
      flex: 1 1 auto;
      justify-content: start;
      align-items: center;
      height: fit-content;
      width: fit-content;
    }
    .floating-svg {
      position: absolute;
      left: 0px;
      /* right: 0px; */
      top: 0px;
      width: 0px;
      height: 0px;
      background-color: lightblue;
      z-index: -2;
    }
    .floating-svg-2 {
      position: absolute;
      left: 0px;
      /* right: 0px; */
      top: 0px;
      width: 100%;
      height: 100%;
      z-index: -2;
    }
    .floating-text {
      /* This ensures it is not part of flexbox sizing. */
      position: relative;
      width: 0px;
      height: 0px;
      background-color: white;
      /* border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 10px; */
      font-family: Arial, sans-serif;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      /* No need for z-index unless you have multiple overlapping elements */
    }
    .array-indexes {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      flex-grow: 1; /* Don't grow unless forced */
      flex-shrink: 1; /* Can shrink */
      flex-basis: auto; /* Fit content */
      justify-content: space-evenly;
      flex: 1;
      width: fit-content;
    }
    .times-gap {
      position: relative;
      /* flex: 1 1 20px; */
      height: 20px;
      width: 100%;
      /* width: fit-content; */
      display: flex;
      overflow: hidden;
      width: fit-content;
      svg { 
        stroke-dasharray: 10,10;
        min-width: 10px;
        /* width: 100%; */
      }
    }
    .separator {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      width: 100%;
      height: 100%;
    }
    .morphism {
      display: flex;
      flex-direction: row;
      /* min-width: 50px; */
      width: fit-content;
      height: 50px;
      overflow: hidden;
    }
    .broadcasted {
      display: flex;
      /* flex: 0 1 50px; */
      width: 50px;
      height: 50px;
      overflow: hidden;
    }
    .broadcasted-core {
      position: relative;
      width: 50px;
      /* height: 50px; */
      min-height: 0;
      /* align-self: stretch; */
    }
    .broadcasted-horizontal-box {
      display: flex;
      /* flex: 1 1 auto; */
      width: fit-content;
      flex-direction: row;
      /* justify-content: flex-start; */
      align-items: center;
      min-height: 0;
    }
    .broadcasted-anchor-column {
      display: flex;
      flex: 0 1 0px;
      flex-direction: column;
      width: 10px;
      justify-content: space-around;
    }
    .broadcasted-anchor {
      position: relative;
      width: 10px;
      height: 0px;
      flex: 1 1 0px;
    }
    .wire {
      position: relative;
      flex: 1 1 20px;
      height: 0px;
      width: 0px;
    }
    /* New Styles */
    .stack_main {
      position: relative;
      display: flex;
      flex-direction: row;
      min-width: 50px;
      width: fit-content;
      height: fit-content;
    }
    .stack_annotations {
      position: absolute;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: row;
      min-width: 50px;
      width: fit-content;
      height: fit-content;
    }
    .annotation_katex {
      position: absolute;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* The legend and the inspection boxes. `src/advanced_display/` writes the
       colours of both, because they follow the diagram's theme. */
    .axis-legend {
      border-collapse: collapse;
      white-space: nowrap;
    }
    .axis-legend td, .axis-legend th {
      vertical-align: middle;
    }
    .inspection-box {
      position: absolute;
      overflow: auto;
    }
    .inspection-box-header {
      font-size: 1.1em;
    }
    .inspection-box-references a {
      color: inherit;
    }
    .inspection-box-diagram {
      position: relative;
      display: flex;
      flex-direction: row;
      width: fit-content;
      height: fit-content;
    }
  </style>
</head>
<body>
  <h1 id="page-heading" hidden>tsncd</h1>
  <div id="page-loading" class="page-loading">
    <div class="page-loading-ring"></div>
  </div>
  
  <!-- The image element our class will work with -->
  <!-- <img id="myImage" src="/api/placeholder/200/150" alt="Sample image"> -->
  
  <div id="diagram" class="stack_main">
    <!-- Diagram content will be generated here -->
  </div>

  <!-- The bundle is injected here by HtmlWebpackPlugin; its name is
       content-hashed, so it cannot be written out by hand. -->
</body>
</html>
